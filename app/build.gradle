plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.lanshare'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.lanshare"
        minSdk 26        // API 26+ 才支持 PBKDF2WithHmacSHA256，须与浏览器端派生方式一致
        targetSdk 34
        versionCode 38
        versionName "5.8"
    }

    buildFeatures {
        viewBinding true
        buildConfig true   // AGP 8.0+ 默认关闭，必须显式开启，否则代码中引用的 BuildConfig 无法生成
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // 引用式架构：列表/大图直接用 HTTP 直链加载，自带内存与磁盘缓存
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
